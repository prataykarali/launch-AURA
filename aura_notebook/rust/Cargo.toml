[dependencies]
# Core error handling
thiserror  = "1"
anyhow     = "1"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Flutter Rust Bridge
flutter_rust_bridge = "2"

# RIG framework - ADD THIS!
rig = { package = "rig-core", version = "0.33.0", features = ["derive"] }

# Your local Candle fork
candle-core         = { path = "candle_local/candle-core" }
candle-nn           = { path = "candle_local/candle-nn" }
candle-transformers = { path = "candle_local/candle-transformers" }

# Tokenizers & async
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio      = { version = "1.0", features = ["full"] }

# Performance
rayon    = "1.10"
mimalloc = { version = "0.1", default-features = false }

# Tools
chrono   = "0.4"