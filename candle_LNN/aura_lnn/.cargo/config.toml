# ── DESKTOP (Linux/Intel) ─────────────────────────────────────────────────────
[build]
rustflags = ["-C", "target-cpu=native"]

# ── ANDROID ARM64 ─────────────────────────────────────────────────────────────
[target.aarch64-linux-android]
rustflags = [
    "-C", "target-cpu=cortex-a55",
    "-C", "target-feature=+neon,+fp16,+dotprod",
    "-C", "opt-level=3"
]
