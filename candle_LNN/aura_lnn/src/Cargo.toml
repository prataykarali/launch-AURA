[package]
name    = "aura_lnn"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib only — staticlib removed to fix rustc 1.94 ICE
# (ar_archive_writer overflow with lto + large MKL archive)
crate-type = ["cdylib"]

[features]
default = []
cuda    = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl     = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

[dependencies]
openssl             = { version = "0.10", features = ["vendored"] }
flutter_rust_bridge = "=2.12.0"
memmap2             = "0.9"
thiserror           = "1"
anyhow              = "1"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1"
rig                 = { package = "rig-core", version = "0.6", features = ["derive"] }
tokenizers          = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio               = { version = "1.0", features = ["full"] }
rayon               = "1.10"
chrono              = { version = "0.4", features = ["clock"] }
once_cell           = "1.21.4"
tracing             = "0.1"

candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
candle-core         = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
candle-nn           = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
candle-transformers = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
mimalloc            = { version = "0.1", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
tikv-jemallocator   = { version = "0.6", features = ["disable_initial_exec_tls"] }

# Desktop: lto=false to avoid ICE with large MKL archives on rustc 1.94
[profile.release]
opt-level       = 3
lto             = false
codegen-units   = 1
panic           = "abort"
strip           = true

# Android: thin-LTO is safe (no MKL, archive stays small)
[profile.release-android]
inherits        = "release"
lto             = "thin"

[profile.release.package.candle-core]
opt-level = 3

[profile.release.package.candle-nn]
opt-level = 3

[profile.release.package.candle-transformers]
opt-level = 3
