[package]
name    = "aura_lnn"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
cuda    = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl     = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

# ── COMMON ────────────────────────────────────────────────────────────────────
[dependencies]
flutter_rust_bridge = "=2.11.1"
memmap2             = "0.9"
thiserror           = "1"
anyhow              = "1"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1"
rig                 = { package = "rig-core", version = "0.33.0", features = ["derive"] }
tokenizers          = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio               = { version = "1.0", features = ["full"] }
rayon               = "1.10"
chrono              = "0.4"
once_cell           = "1.21.4"
tracing             = "0.1"

# Declare the Git source FULLY here.
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }

# ── DESKTOP — Linux / Windows / Intel x86_64 ─────────────────────────────────
[target.'cfg(target_arch = "x86_64")'.dependencies]
# You MUST repeat the git URL here to satisfy the "Canonical Path" rule, 
# while adding the MKL feature.
candle-core         = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
candle-nn           = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
candle-transformers = { git = "https://github.com/huggingface/candle.git", features = ["mkl"] }
mimalloc            = { version = "0.1", default-features = false }

# ── MOBILE — Android ARM64 ───────────────────────────────────────────────────
[target.'cfg(target_arch = "aarch64")'.dependencies]
# Point to the same git source. Android uses NEON via RUSTFLAGS, so no features needed here.
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
tikv-jemallocator    = { version = "0.6", features = ["disable_initial_exec_tls"] }

# ... (keep your existing dependencies) ...

# ── EXTREME PERFORMANCE OPTIMIZATIONS FOR MOBILE ─────────────────────────────
[profile.release]
opt-level = 3          # Maximum CPU optimization
lto = "thin"            # Link Time Optimization across all crates (crucial for Candle)
codegen-units = 1      # Slower compile time, but fastest possible runtime execution
panic = "abort"        # Reduces binary size and overhead
strip = true           # Removes debug symbols to save RAM and APK size

[profile.release.package.candle-core]
opt-level = 3

[profile.release.package.candle-nn]
opt-level = 3

[profile.release.package.candle-transformers]
opt-level = 3

[env]
RAYON_NUM_THREADS = "4"