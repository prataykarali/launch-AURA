[package]
name = "aura_lnn"
version = "0.1.0"
edition = "2024"

[lib]
name = "aura_lnn"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda"
]

[dependencies]
# Error handling
thiserror   = "1"
anyhow      = "1"

# Serde
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1"

# Rig
rig = { package = "rig-core", version = "0.33.0", features = ["derive"] }

# Candle — no cuda here, cuda comes from [features]
candle-core         = { git = "https://github.com/huggingface/candle", rev = "38e72021" }
candle-nn           = { git = "https://github.com/huggingface/candle", rev = "38e72021" }
candle-transformers = { git = "https://github.com/huggingface/candle", rev = "38e72021" }

# Tokenizer
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# Runtime
tokio    = { version = "1.0", features = ["full"] }
rayon    = "1.10"
mimalloc = { version = "0.1", default-features = false }
chrono   = "0.4"