[package]
name    = "aura_lnn"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["cpu", "voice"]
cpu = []
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
gen_cache = []
# Voice STT/TTS via sherpa-onnx. Enabled by default on host builds; disabled
# when cross-compiling for Android (sherpa-onnx has no Android prebuilts).
# Android builds pass: --no-default-features --features cpu
voice = ["dep:sherpa-onnx", "dep:rodio"]

# ── COMMON ────────────────────────────────────────────────────────────────────
[dependencies]

rusqlite            = { version = "0.31", features = ["bundled"] }
sqlite-vec          = "0.1"
uuid                = { version = "1", features = ["v4"] }
flutter_rust_bridge = "=2.12.0"
thiserror           = "1"
anyhow              = "1"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1"
tokio               = { version = "1.0", features = ["full"] }
rayon               = "1.10"
chrono              = "0.4"
once_cell           = "1.21.4"
tracing             = "0.1"
libc                = "0.2"
cc                  = "1.0"
include_dir         = "0.7"
# sherpa-onnx (voice STT/TTS) ships no Android prebuilts in its build script,
# so it is gated to non-Android targets. On Android, the stt/tts modules expose
# stub symbols so the rest of the bridge (chat, memory, vision) builds & runs.
sherpa-onnx         = { version = "1.13", optional = true }
rodio               = { version = "0.19", optional = true, features = ["mp3"] }

# Dedicated embedding model (bge-small-en-v1.5 ONNX, 384-dim) for semantic
# memory RAG + topic-drift detection. Runs on ONNX Runtime, independent of the
# chat LLM's KV cache. `ort` fetches a prebuilt static ONNX Runtime binary per
# target (no native toolchain needed). Same abstraction will host the CLIP
# vision embedder when vision is added.
ort                 = { version = "2.0.0-rc.10", features = ["download-binaries"] }
tokenizers          = { version = "0.20", default-features = false, features = ["onig"] }
ndarray             = "0.17"

# llama.cpp Rust bindings - tracks upstream llama.cpp (for Linux fallback)
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", branch = "update-llama-cpp-2026-05-01", features = ["sampler"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log            = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
minifb = "0.28"

# ── RELEASE PROFILE ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.release.package.llama-cpp-2]
opt-level = 3

# ── DEVELOPMENT PROFILE (for FFI speed in debug mode) ───────────────────────
[profile.dev]
opt-level = 3

[profile.dev.package.llama-cpp-2]
opt-level = 3
