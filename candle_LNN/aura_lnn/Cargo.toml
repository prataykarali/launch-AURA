[package]
name    = "aura_lnn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gen_cache"
path = "src/bin/gen_cache.rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
gen_cache = []
research  = []

# ── COMMON ────────────────────────────────────────────────────────────────────
[dependencies]
rusqlite            = { version = "0.31", features = ["bundled"] }
sqlite-vec          = "0.1"
fastembed           = "5"
uuid                = { version = "1", features = ["v4"] }
flutter_rust_bridge = "=2.12.0"
memmap2             = "0.9"
thiserror           = "1"
anyhow              = "1"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1"
rig                 = { package = "rig-core", version = "0.33.0", features = ["derive"] }
tokenizers          = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio               = { version = "1.0", features = ["full"] }
rayon               = "1.10"
chrono              = "0.4"
once_cell           = "1.21.4"
tracing             = "0.1"

# ── DESKTOP — Linux / Windows / Intel x86_64 ─────────────────────────────────
# ── DESKTOP — Linux / Windows / Intel x86_64 ─────────────────────────────────
[target.'cfg(target_arch = "x86_64")'.dependencies]
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
# mimalloc is removed to prevent static TLS block exhaustion via FFI

# ── MOBILE — Android ARM64 ───────────────────────────────────────────────────
[target.'cfg(target_arch = "aarch64")'.dependencies]
candle-core         = { git = "https://github.com/huggingface/candle.git" }
candle-nn           = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
tikv-jemallocator   = { version = "0.6", features = ["disable_initial_exec_tls"] }

# ── RELEASE PROFILE ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.release.package.candle-core]
opt-level = 3

[profile.release.package.candle-nn]
opt-level = 3

[profile.release.package.candle-transformers]
opt-level = 3