[package]
name = "aura_lnn"
version = "0.1.0"
edition = "2024"

[lib]
name = "aura_lnn"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = [cuda]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

[dependencies]
thiserror  = "1"
anyhow     = "1"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1"
rig        = { package = "rig-core", version = "0.33.0", features = ["derive"] }

# ── Local fork with snapshot/restore ────────────────────────────────────────
candle-core         = { path = "candle_local/candle-core" }
candle-nn           = { path = "candle_local/candle-nn" }
candle-transformers = { path = "candle_local/candle-transformers" }

tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio    = { version = "1.0", features = ["full"] }
rayon    = "1.10"
mimalloc = { version = "0.1", default-features = false }
chrono   = "0.4"