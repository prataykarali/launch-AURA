[package]
name = "aura_lnn"
version = "0.1.0"
edition = "2024"

[lib]
name = "aura_lnn"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
# Use MKL for Intel high-performance math
mkl = [
    "candle-core/mkl",
    "candle-nn/mkl",
    "candle-transformers/mkl",
]
[[bin]]
name = "aura_cli"
path = "src/main.rs"

[dependencies]
flutter_rust_bridge         = "=2.11.1"
memmap2                     = "0.9"
thiserror                   = "1"
anyhow                      = "1"
serde                       = { version = "1.0", features = ["derive"] }
serde_json                  = "1"
rig                         = { package = "rig-core", version = "0.33.0", features = ["derive"] }

# ── candle from crates.io — no more local fork needed ────────────────────────
candle-core                 = { version = "0.8" }
candle-nn                   = { version = "0.8" }
candle-transformers         = { version = "0.8" }

tokenizers                  = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio                       = { version = "1.0", features = ["full"] }
rayon                       = "1.10"
mimalloc                    = { version = "0.1", default-features = false }
chrono                      = "0.4"
flutter_rust_bridge_codegen = "2.11.1"
once_cell                   = "1.21.4"
tracing = "0.1.44"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

# ── ADD THIS ─────────────────────────────────────────────────────────────────

tracing = "0.1"
